<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30 Exercícios JavaScript</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <h1>JS</h1>
        <p>30 Exercícios</p>
      </div>
      <div class="menu-header">
        <strong>Escolha um exercício</strong>
      </div>
      <nav class="menu" id="exerciseMenu"></nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button id="menuToggle" class="menu-toggle">☰</button>
        <div>
          <h2 id="mainTitle">Bem-vindo</h2>
          <p id="mainDescription">Selecione um exercício no menu para começar.</p>
        </div>
      </header>

      <section class="exercise-panel">
        <div id="exerciseControls" class="exercise-controls"></div>
        <div id="exerciseResult" class="exercise-result"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
